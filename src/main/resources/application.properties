spring.application.name=autocheck360

# Porta do Servidor (compatibilidade com nuvens como Render, Railway e Heroku que injetam $PORT)
server.port=${PORT:8080}

# Configurações do Banco de Dados PostgreSQL (Local / Supabase / Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autocheck}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate (Flyway gerencia o schema, por isso ddl-auto fica como validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Limite para upload de fotos de vistorias (Multipart)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Configuração da API do Gemini Vision (Google AI Studio)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# JWT Security
jwt.secret=${JWT_SECRET:my-secret-key-360-security-production-key}
jwt.expiration-hours=24
