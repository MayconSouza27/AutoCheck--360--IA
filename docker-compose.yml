version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autocheck-db
    restart: always
    environment:
      POSTGRES_DB: autocheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autocheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: autocheck-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/autocheck
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-my-super-secret-production-jwt-key-360}

volumes:
  pgdata:
